# GitLab mirror of the GitHub Actions quality gate.
#
# The GitHub workflows under .github/workflows/ stay in the tree and remain the
# release pipeline (quality.yml, mithkax-android.yml, mithkax-desktop.yml).
# This file is the interim source gate while the GitHub account is suspended and
# only mirrors the checks that do not need GitHub-only services or secrets.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - quality

variables:
  FLUTTER_VERSION: "3.44.2"
  FLUTTER_TARBALL: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  DEBIAN_FRONTEND: "noninteractive"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

quality:
  stage: quality
  image: ubuntu:24.04
  timeout: 60m
  interruptible: true
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git libglu1-mesa python3 unzip xz-utils zip
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global --add safe.directory /opt/flutter
    - |
      if [ ! -x /opt/flutter/bin/flutter ]; then
        curl -fsSL "$FLUTTER_TARBALL" -o /tmp/flutter.tar.xz
        tar xJf /tmp/flutter.tar.xz -C /opt
        rm /tmp/flutter.tar.xz
      fi
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter --version
  script:
    - cp lib/config/secrets_example.dart lib/config/secrets.dart
    - flutter pub get
    - python3 translations/tools/check.py
    - python3 translations/tools/gen_assets.py --check
    - python3 tool/check_l10n_strings.py
    - python3 tool/gen_registration_anchors.py --check
    - python3 tool/optimize_app_artwork.py --check
    - dart format --output=none --set-exit-if-changed lib test integration_test test_driver
    - flutter analyze
    - flutter test --concurrency=4
